<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <title>Weather!</title>
</head>
<body>
    <div class="wrapper">
        <div class="header-container">
            <h1 class="title">WEATHER?!</h1>
            <!-- something for the F/C toggle here -->
        </div>
        <div class="form-container">
            <form action="" class="input">
                <label for="location-input">
                    <input type="text" id="location-input" name="location-input" required minlength="3">
                    <span id="location-input-error" class="error" aria-live=""polite"></span>
                </label>
                <button class="submit-button">Search</button>
            </form>
        </div>
        <div class="weather-container">
            <div class="today-weather">

            </div>
            <div class="tomorrow-weather">
        
            </div>
        </div>
    </div>
</body>
</html>
