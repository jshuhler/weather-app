<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <title>Weather!</title>
</head>
<body>
    <div class="wrapper">
        <div class="header-container">
            <h1 class="title">WEATHER?!</h1>
            <label for="unit-toggle" class="unit-toggle">

            </label>
        </div>
        <div class="form-container">
            <form action="" class="input">
                <label for="location-input">
                    <input type="text" id="location-input" name="location-input" required minlength="3">
                    <span id="location-input-error" class="error" aria-live=""polite"></span>
                </label>
                <button class="submit-button">Search</button>
            </form>
        </div>
        <div class="weather-container">
            <h2 class="location-title"></h2>
            <div class="forecast-container">
                <div id="today-weather-card" class="forecast-weather-card">
                    <div id="current-temp" class="forecast-temp"></div>
                    <div id="current-icon-container" class="forecast-icon-container">
                        <img id="current-forecast-icon" class="forecast-icon">
                    </div>
                    <div id="current-conditions" class="forecast-conditions"></div>
                    <div id="current-high" class="forecast-high"></div>
                    <div id="current-low" class="forecast-low"></div>
                </div>
                <div id="tomorrow-weather-card" class="forecast-weather-card">
                    <div id="tomorrow-temp" class="forecast-temp"></div>
                    <div id="tomorrow-icon-container" class="forecast-icon-container"></div>
                    <div id="tomorrow-conditions" class="forecast-conditions"></div>
                    <div id="tomorrow-high" class="forecast-high"></div>
                    <div id="tomorrow-low" class="forecast-low"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
